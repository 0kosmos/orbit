<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit</title>
    <style>
      html, body { background: #000; }
      /* The in-game overlay window is see-through from the very first frame. */
      html.overlay-window, html.overlay-window body { background: transparent !important; }
    </style>
    <script>
      // Overlay and snip windows are see-through from the very first frame.
      if (location.pathname.startsWith("/overlay") || location.pathname.startsWith("/snip"))
        document.documentElement.classList.add("overlay-window");
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
